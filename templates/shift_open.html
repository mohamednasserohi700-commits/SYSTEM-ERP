{% extends 'base.html' %}
{% set block_icon = 'fas fa-wallet' %}
{% block title %}فتح وردية{% endblock %}
{% block page_title %}فتح وردية جديدة{% endblock %}
{% block breadcrumb %}أدخل الرصيد الافتتاحي لدرج الكاش{% endblock %}

{% block content %}
<div class="card" style="max-width:520px;"><div class="card-body">
    <form method="POST">
        <div class="form-group">
            <label class="form-label">الرصيد الافتتاحي (الكاش الموجود في الدرج الآن) *</label>
            <input type="number" name="opening_balance" class="form-control" step="0.01" min="0" value="0" required autofocus>
        </div>
        <div class="form-group">
            <label class="form-label">ملاحظات</label>
            <textarea name="notes" class="form-control" placeholder="أي ملاحظات عن بداية الوردية..."></textarea>
        </div>
        <div style="display:flex;gap:10px;">
            <button type="submit" class="btn btn-primary"><i class="fas fa-play-circle"></i> فتح الوردية</button>
            <a href="{{ url_for('shifts') }}" class="btn btn-outline">إلغاء</a>
        </div>
    </form>
</div></div>
{% endblock %}
